external_components:
  - source:
      type: git
      url: https://github.com/nithino/Megmeet-Lloyd-ESPHome-HVAC
      ref: main
    components:
      - megmeet_uart
  refresh: 0s
  
logger:
  level: DEBUG

uart:
  id: uart_bus
  tx_pin: GPIO20
  rx_pin: GPIO21
  baud_rate: 9600
  parity: EVEN

climate:
  - platform: megmeet_uart
    name: "Master AC"

megmeet_uart:
  id: megmeet
  status_raw:
    name: "AC Status Raw"
  setpoint_celsius:
    name: "AC Setpoint"
  heartbeat_tick:
    name: "AC Heartbeat Tick"
  power_requested:
    name: "AC Power Requested"
  ac_running:
    name: "AC Running"
  last_fan_event_frame:
    name: "AC Last Fan Event Frame"
  last_mode_event_frame:
    name: "AC Last Mode Event Frame"
