esphome:
  name: master-ac-lloyd
  friendly_name: master-ac-lloyd

esp32:
  board: esp32-c3-devkitm-1
  framework:
    #type: esp-idf
    type: arduino
logger:
  level: DEBUG
  baud_rate: 0
api:
  homeassistant_states: true
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 15dB
  power_save_mode: none
  use_address: 192.168.10.249
  ap:
    ssid: "Master-Ac-Lloyd Fallback Hotspot"
    password: !secret wifi_password
captive_portal:
web_server:

external_components:
  - source:
      type: git
      url: https://github.com/nithino/Megmeet-Lloyd-ESPHome-HVAC
      ref: main
    components: [megmeet_tuya]
    refresh: 1d

remote_receiver:
  id: rcvr
  pin: 3
  dump: pronto

infrared:
  - platform: ir_rf_proxy
    name: Master Lloyd AC IR Receiver
    id: master_ir_blaster_receiver
    receiver_frequency: 38kHz
    remote_receiver_id: rcvr

uart:
  id: uart_bus
  tx_pin: GPIO20
  rx_pin: GPIO21
  baud_rate: 9600
  parity: NONE
  rx_buffer_size: 1024
  # Log only what WE transmit (received frames are decoded by megmeet_tuya)
  debug:
    direction: TX
    dummy_receiver: false
    after:
      timeout: 5ms
    sequence:
      - lambda: UARTDebug::log_hex(direction, bytes, ' ');

# Reads the AC's Tuya-style (55 AA, ver 00, cmd 07) datapoint stream. No heartbeats (AC never answers them).
# UART sensors are averaged over 60 s: the AC re-sends values every 1-2 s and flips by +/-2 steps.
megmeet_tuya:
  id: lloyd
  uart_id: uart_bus

# Probe tool: type hex bytes into "UART TX Hex", then press "UART TX Send".
# Special words: INV1 / INV0 = invert / un-invert TX signal (diagnostic), HB = send heartbeat.
text:
  - platform: template
    id: uart_tx_hex
    name: "Master AC UART TX Hex"
    mode: text
    optimistic: true
    max_length: 200
    entity_category: config

button:
  - platform: template
    name: "Master AC UART TX Send"
    entity_category: config
    on_press:
      - lambda: |-
          std::string s = id(uart_tx_hex).state;
          if (s == "INV1") { id(lloyd).set_tx_inverted(20, true); return; }
          if (s == "INV0") { id(lloyd).set_tx_inverted(20, false); return; }
          if (s == "HB") { id(lloyd).send_command(0x00, {}); return; }
          std::vector<uint8_t> out;
          std::string tok;
          for (size_t i = 0; i <= s.size(); i++) {
            char c = i < s.size() ? s[i] : ' ';
            if (isxdigit((unsigned char) c)) {
              tok += c;
              if (tok.size() == 2) { out.push_back(strtol(tok.c_str(), nullptr, 16)); tok.clear(); }
            } else if (!tok.empty()) { out.push_back(strtol(tok.c_str(), nullptr, 16)); tok.clear(); }
          }
          if (out.empty()) { ESP_LOGW("probe", "nothing to send"); return; }
          id(lloyd).send_raw(out);

binary_sensor:
  - platform: megmeet_tuya
    name: "Master AC UART Link"

sensor:
  # ---- Values reported by the AC over UART ----
  - platform: megmeet_tuya
    datapoint: 109
    name: "Master AC Room Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - throttle_average: 60s
  - platform: megmeet_tuya
    datapoint: 124
    name: "Master AC Indoor Coil Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - throttle_average: 60s
  - platform: megmeet_tuya
    datapoint: 135
    name: "Master AC Outdoor Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - throttle_average: 60s
  - platform: megmeet_tuya
    datapoint: 122
    name: "Master AC Supply Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - throttle_average: 60s
  - platform: megmeet_tuya
    datapoint: 136
    name: "Master AC DC Bus Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - throttle_average: 60s
    entity_category: diagnostic
  - platform: megmeet_tuya
    datapoint: 133
    name: "Master AC DP133"
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - throttle_average: 60s
    entity_category: diagnostic
  - platform: megmeet_tuya
    datapoint: 134
    name: "Master AC DP134"
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - throttle_average: 60s
    entity_category: diagnostic
  - platform: megmeet_tuya
    datapoint: 112
    name: "Master AC DP112"
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - throttle_average: 60s
    entity_category: diagnostic
  - platform: megmeet_tuya
    datapoint: 138
    name: "Master AC DP138"
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - throttle_average: 60s
    entity_category: diagnostic
  - platform: megmeet_tuya
    datapoint: 131
    name: "Master AC DP131"
    accuracy_decimals: 0
    entity_category: diagnostic

  # ---- Imported from Home Assistant ----
  - platform: homeassistant
    id: indoor_temp_sensor
    entity_id: sensor.master_room_temperature_sensor_temperature
    name: "Master AC Indoor Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
  - platform: homeassistant
    id: ac_power_consumption
    entity_id: sensor.master_ac_qubo_power
    name: "Master AC Power Consumption"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement

  - platform: homeassistant
    name: "Temperature Sensor From Home Assistant"
    entity_id: sensor.master_room_temperature_sensor_temperature
